<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Pet Sender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 540px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        h1 {
            color: #4a00e0;
            text-align: center;
            margin-bottom: 8px;
            font-size: 30px;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14.5px;
        }
        input, textarea {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14.5px;
            transition: all 0.3s ease;
            background: #fdfdfd;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0 0 0 4px rgba(106, 17, 203, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 135px;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(106, 17, 203, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .error, .success {
            padding: 14px;
            border-radius: 10px;
            margin-top: 16px;
            font-size: 14px;
            border-left: 5px solid;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            border-color: #c62828;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #2e7d32;
        }
        .info-box {
            background: linear-gradient(135deg, #f0f4ff 0%, #e6f0ff 100%);
            border: 1px solid #6a11cb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 22px;
            font-size: 13.5px;
            color: #2c3e50;
        }
        .info-box strong {
            color: #4a00e0;
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .info-box code {
            background: white;
            padding: 3px 7px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            color: #d32f2f;
            font-weight: bold;
        }
        .terminal {
            background: #0d1117;
            color: #c9d1d9;
            padding: 16px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-top: 20px;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid #30363d;
            display: none;
        }
        .terminal.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        .terminal-line {
            margin: 6px 0;
            white-space: pre-wrap;
        }
        .terminal-success { color: #56d364; }
        .terminal-error { color: #f85149; }
        .step-indicator {
            text-align: center;
            margin-bottom: 30px;
        }
        .step-indicator span {
            display: inline-block;
            width: 34px;
            height: 34px;
            line-height: 34px;
            border-radius: 50%;
            background: #ddd;
            margin: 0 6px;
            font-weight: bold;
            color: #777;
            font-size: 14px;
        }
        .step-indicator span.active {
            background: #6a11cb;
            color: white;
            box-shadow: 0 0 0 4px rgba(106, 17, 203, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Roblox Pet Sender</h1>
        <p class="subtitle">Envio seguro de pets via webhook</p>

        <div class="step-indicator">
            <span class="active" id="indicator1">1</span>
            <span id="indicator2">2</span>
        </div>

        <!-- Etapa 1: Chave -->
        <div class="step active" id="step1">
            <div class="input-group">
                <label for="apiKey">Chave de Acesso (COFI-XXX-XXX)</label>
                <input type="text" id="apiKey" placeholder="COFI-ABC-123" maxlength="60">
            </div>
            <button onclick="validateKey()">Validar Chave</button>
            <div id="keyError"></div>
        </div>

        <!-- Etapa 2: Dados -->
        <div class="step" id="step2">
            <div class="info-box">
                <strong>Formato aceito por linha:</strong><br>
                <code>1x Nome ($X(K|M|B|T)/s)</code> • <code>1x Nome ($XX.XXK/s)</code> • <code>1x Nome ($999.99T/s)</code><br><br>
                <strong>Exemplos válidos:</strong><br>
                <code>1x Yin Yang Slap ($2.40M/s)</code><br>
                <code>1x Golden Dragon ($1.23T/s)</code><br>
                <code>1x Rainbow Egg ($80.5B/s)</code>
            </div>

            <div class="input-group">
                <label for="servidor">Link do Servidor</label>
                <input type="url" id="servidor" placeholder="https://www.roblox.com/share?code=...">
            </div>

            <div class="input-group">
                <label for="usuario">Usuário Roblox</label>
                <input type="text" id="usuario" placeholder="Ex: Rafinha_aposentado">
            </div>

            <div class="input-group">
                <label for="saldo">Saldo (padrão: 26.74T)</label>
                <input type="text" id="saldo" value="26.74T">
            </div>

            <div class="input-group">
                <label for="brainrots">Pets (1 por linha)</label>
                <textarea id="brainrots" placeholder="1x Yin Yang Slap ($2.40M/s)
1x Golden Egg ($195M/s)
1x Rainbow Dragon ($80.5B/s)"></textarea>
            </div>

            <button onclick="sendData()">Enviar via Webhook</button>
            <div id="sendError"></div>
            <div id="terminal" class="terminal"></div>
        </div>
    </div>

    <script>
        const AUTH_TOKEN = "9fa2b83ce1d47f6a2ec95b1d8af34ce7b16d9a2fc58e3d7b1af64ec29d5ae8b37c2bf16e9c3ad75fe41c8db64ac87e2df93ea51bd26c9be35c8b2af4c17d4be6";

        function validateKey() {
            const key = document.getElementById('apiKey').value.trim();
            const errorDiv = document.getElementById('keyError');
            const regex = /^COFI-[A-Z0-9]+-[A-Z0-9]+$/i;

            errorDiv.innerHTML = '';

            if (!key) {
                errorDiv.innerHTML = '<div class="error">Insira uma chave de acesso</div>';
                return;
            }

            if (!regex.test(key)) {
                errorDiv.innerHTML = '<div class="error">Formato inválido! Use: COFI-XXX-XXX</div>';
                return;
            }

            errorDiv.innerHTML = '<div class="success">Chave validada com sucesso!</div>';

            setTimeout(() => {
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
                document.getElementById('indicator1').classList.remove('active');
                document.getElementById('indicator2').classList.add('active');
            }, 700);
        }

        function validatePetLine(line) {
            const t = line.trim();
            if (!t) return true;
            const regex = /^\d+x\s+.+\s+\(\$\d{1,3}(\.\d{1,2})?[KMBTkmbt]\/s\)$/i;
            return regex.test(t);
        }

        async function sendData() {
            const errorDiv = document.getElementById('sendError');
            const terminal = document.getElementById('terminal');
            const apiKey = document.getElementById('apiKey').value.trim();
            const servidor = document.getElementById('servidor').value.trim();
            const usuario = document.getElementById('usuario').value.trim();
            const saldo = document.getElementById('saldo').value.trim();
            const brainrotsText = document.getElementById('brainrots').value;

            errorDiv.innerHTML = '';
            terminal.innerHTML = '';
            terminal.classList.remove('active');

            if (!servidor || !usuario || !saldo || !brainrotsText.trim()) {
                errorDiv.innerHTML = '<div class="error">Preencha todos os campos</div>';
                return;
            }

            const lines = brainrotsText.split('\n');
            const invalid = [];
            lines.forEach((l, i) => {
                if (l.trim() && !validatePetLine(l)) {
                    invalid.push(`${i + 1}: <code>${l.trim()}</code>`);
                }
            });

            if (invalid.length > 0) {
                errorDiv.innerHTML = `<div class="error">Linha(s) inválida(s):<br>${invalid.join('<br>')}<br><br>Use: <code>1x Nome ($123.45K/s)</code></div>`;
                return;
            }

            const validLines = lines.filter(l => l.trim());
            const payload = {
                Players: "1/8",
                Saldo: saldo,
                ServidorPrivado: true,
                Servidor: servidor,
                Usuario: usuario,
                Brainrots: validLines.join('\n')
            };

            terminal.classList.add('active');
            terminal.innerHTML = '<div class="terminal-line">Conectando ao servidor...</div>';
            terminal.innerHTML += '<div class="terminal-line">Enviando dados...</div>';

            try {
                const res = await fetch('https://keycontroller.squareweb.app/api/private/webhook/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'Authorization': `Bearer ${AUTH_TOKEN}`
                    },
                    body: JSON.stringify(payload)
                });

                const text = await res.text();

                if (res.status === 200) {
                    terminal.innerHTML += '<div class="terminal-line terminal-success">[200] Sucesso!</div>';
                    terminal.innerHTML += '<div class="terminal-line">Payload enviado:</div>';
                    terminal.innerHTML += `<div class="terminal-line"><pre>${JSON.stringify(payload, null, 2)}</pre></div>`;
                    errorDiv.innerHTML = '<div class="success">Enviado com sucesso!</div>';
                } else {
                    terminal.innerHTML += `<div class="terminal-line terminal-error">[${res.status}] Falha</div>`;
                    terminal.innerHTML += `<div class="terminal-line terminal-error">Resposta: ${text.substring(0, 400)}</div>`;
                    errorDiv.innerHTML = '<div class="error">Falha no envio. Verifique os dados.</div>';
                }
            } catch (err) {
                terminal.innerHTML += `<div class="terminal-line terminal-error">Erro: ${err.message}</div>`;
                errorDiv.innerHTML = '<div class="error">Sem conexão. Tente novamente.</div>';
            }
        }
    </script>
</body>
</html>
